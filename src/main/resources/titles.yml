# Anniversary event: Collectioner is sold as shards in the festive shop (BrilliantEmporium
# seasonal shop). Right-clicking while holding >= required-count shards consumes them and
# unlocks the title above - see CollectionerShardService / CollectionerShardListener.
collectioner-shard:
  required-count: 5
  material: AMETHYST_CLUSTER
  name: "<#CC8844>Collectioner Shard"
  lore:
    - "<gray>A fragment of a complete collection."
    - "<gray>Gather 5 to claim the Collectioner title."
    - "<dark_gray>Right-click to redeem once you have enough."

# Anniversary event: currency for the festive shop (BrilliantEmporium seasonal shop). Minted
# only via `/titles admin token give` (called from the Advent Calendar's reward commands) so
# every source produces an item identical to the shop's configured payment-item.
anniversary-token:
  material: AMETHYST_SHARD
  name: "<gold><bold>Anniversary Token"
  lore:
    - "<gray>Currency for the 1-year anniversary festive shop."
    - "<dark_gray>22.07.2026 - 05.08.2026"
